spring:
  application:
    name: legal-portal-backend
  # Load local credentials from the repo-root .env (shared with docker-compose.yml)
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include:
  endpoint:
    health:
      show-details: never
