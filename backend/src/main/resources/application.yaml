spring:
  application:
    name: legal-portal-backend
  # Load local credentials from the repo-root .env (shared with docker-compose.yml)
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it at startup
      ddl-auto: validate
  flyway:
    # Databases created before Flyway already hold the session tables: baseline them at version 0 so every
    # migration still runs (V1 tolerates the existing tables)
    baseline-on-migrate: true
    baseline-version: 0
  session:
    jdbc:
      # The SPRING_SESSION tables are created by Flyway (V1)
      initialize-schema: never
server:
  # Behind the ALB, take the client IP from X-Forwarded-For (Tomcat only trusts it from internal proxy addresses);
  # login rate limiting counts failures per client IP
  forward-headers-strategy: native
  servlet:
    session:
      # Applied to Spring Session's SESSION cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
app:
  security:
    login-rate-limit:
      max-failures-per-email: 5
      max-failures-per-ip: 50
      window: 15m
management:
  endpoints:
    web:
      exposure:
        include:
  endpoint:
    health:
      show-details: never
