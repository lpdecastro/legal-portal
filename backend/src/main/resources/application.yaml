spring:
  application:
    name: legal-portal-backend
  # Load local credentials from the repo-root .env (shared with docker-compose.yml)
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  session:
    jdbc:
      # Create the SPRING_SESSION tables on startup (the script is not idempotent, so errors on reruns are ignored)
      initialize-schema: always
server:
  servlet:
    session:
      # Applied to Spring Session's SESSION cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include:
  endpoint:
    health:
      show-details: never
